name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Validate portfolio contract
        shell: pwsh
        run: ./tools/validate-project.ps1 -SkipDocker
      - name: Build image
        run: docker build --tag stroke-signal-demo:${{ github.sha }} .
      - name: Run demo
        run: docker run --rm stroke-signal-demo:${{ github.sha }} demo
      - name: Run benchmark
        run: |
          mkdir -p benchmarks/results
          docker run --rm \
            -v "$PWD/benchmarks/results:/app/benchmarks/results" \
            stroke-signal-demo:${{ github.sha }} \
            benchmark --n-samples 5000 --seed 42 --output /app/benchmarks/results/ci.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: stroke-signal-demo-benchmark
          path: benchmarks/results/ci.json
