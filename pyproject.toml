[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stroke-signal-demo"
version = "0.1.0"
description = "Reproducible stroke prediction classifier benchmark"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]
optional-dependencies = { dev = ["pytest>=8", "ruff>=0.6"] }

[project.scripts]
stroke-signal-demo = "stroke_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
