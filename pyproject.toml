[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stroke-signal-demo"
version = "1.0.0"
description = "Leakage-safe, paper-inspired hemorrhagic-stroke CT segmentation benchmark"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy==2.5.1",
  "scipy==1.18.0",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.20",
]

[project.scripts]
stroke-signal-demo = "stroke_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
