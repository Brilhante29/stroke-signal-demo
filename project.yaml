id: 4
name: stroke-signal-demo
program:
  id: mlops-data-platform
  narrative_fit: "Closes the model-evaluation stage with a medically bounded, patient-isolated segmentation protocol and immutable evidence that can consume validated clinical splits when authorized data becomes available."
  shared_assets:
    - patient-level split identity
    - medical evaluation report v1
    - immutable model and fixture digests
    - benchmark result v2
status: implemented
claim: "One offline Docker command demonstrates a leakage-safe, paper-inspired hemorrhagic-stroke CT segmentation evaluation on deterministic synthetic phantoms without presenting synthetic scores as clinical reproduction."
stack:
  - python-3.12
  - numpy-2.5.1
  - scipy-1.18.0
  - jsonschema-4.26.0
  - docker
language_profile:
  primary: python
  secondary: []
  reason: "Python supplies reproducible numerical imaging primitives while small typed modules keep evaluation policy independent from serving, orchestration, and cloud frameworks."
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: mlops-data-platform
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: medical-contract-candidate-recorded
  principles:
    coupling_rule: "Fixture, split, segmentation, metrics, benchmark, and CLI are separate modules; none imports transport, database, broker, cloud SDK, orchestration, or another repository."
    solid: [srp, ocp, isp, dip]
    simplicity_rule: "Use one deterministic CPU method and one evidence path; do not add deep learning, serving, cloud, or messaging until an authorized dataset and measured requirement justify them."
    testability_rule: "Patient identity, threshold selection, confusion arithmetic, seed search, segmentation, serialization, CLI, and publication evidence are executable in local tests without network or secrets."
    rejected_overengineering:
      - Detectron2 without the paper dataset and weights
      - FastAPI or GraphQL
      - Airflow or MLflow duplication
      - Kafka or RabbitMQ
      - Kumo or real cloud
      - microservices or Kubernetes
  stack_profile: python-ml
  api_style: cli
  messaging: none
  cloud:
    mode: none
    local_provider: none
    real_provider_target: none
    emulated_services: []
    adapter_rule: "No cloud behavior exists in the measured path; authorized object storage would be introduced behind a project-owned port and checked against Kumo before real AWS."
    config_switch: not-applicable
    unsupported_behaviors:
      - clinical PACS integration
      - hosted model registry
      - managed inference
  database: none
  runtime: "Single non-root Python 3.12.13 CPU container pinned by OCI digest; deterministic offline fixture and no paid credentials."
  library_policy: "NumPy owns deterministic numerical fixtures, SciPy owns reviewed morphology and connected components, Jsonschema validates evidence, and standard-library dataclasses own contracts."
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: Full Detectron2 paper reproduction
      reason: "The private 25-exam dataset, annotations, and trained weights are not distributed; claiming equivalent reproduction would be false."
    - option: Tabular RandomForest stroke-risk classifier
      reason: "It solves a different prediction problem and cannot support the cited CT segmentation paper."
    - option: HTTP or GraphQL API
      reason: "The claim is an offline evaluation artifact, not an online serving contract."
    - option: Kafka, RabbitMQ, Kumo, or real cloud
      reason: "No asynchronous or cloud behavior participates in the measured segmentation protocol."
architecture:
  style: pipeline
  reason: "The dominant force is ordered scientific evaluation: fixture identity, patient split, train calibration, validation selection, untouched test segmentation, metrics, and evidence."
  problem_forces:
    domain_complexity: medium
    integration_pressure: low
    ui_state_complexity: none
    data_or_ml_reproducibility: high
    auditability: high
    throughput_or_async: low
    independent_deployability: low
  dependency_rule: "The CLI depends on benchmark orchestration; orchestration depends on fixture, model, and domain values; no inward module depends on transport or infrastructure."
  boundaries:
    - deterministic synthetic CT fixture and identity
    - patient-isolated train, validation, and test assignment
    - train calibration and validation-only model selection
    - quadrant seed and connected-region segmentation
    - pixel confusion and clinical evaluation metrics
    - V1 and V2 benchmark evidence
    - command-line transport
  rejected_alternatives:
    - style: mvc
      reason: "There is no UI state or request controller."
    - style: hexagonal-as-primary
      reason: "No external infrastructure adapter exists; ports would be speculative."
    - style: microservices
      reason: "A single scientific process has no independent deployment boundary."
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components: [readme_header, benchmark_card, architecture_card, references_table]
  diagram_required: true
reuse:
  kit_version: portfolio-reuse-kit@285939b
  uses:
    - catalog
    - mlops-data-platform
    - agentic-spec-governance
    - medical-ai-evaluation
    - benchmark-harness
    - publish-benchmark-evidence
    - python-computer-vision
    - benchmark-result-v2
    - design-system
medical_evaluation:
  positive_class: hemorrhage-pixel
  split_unit: patient
  test_used_for_selection: false
  clinical_use: false
  dataset_kind: deterministic-synthetic-ct-phantom
  paper_doi: 10.1109/IJCNN54540.2023.10191320
benchmark:
  primary_metric: segmentation_dice
  unit: ratio
  command: "docker run --rm --network none stroke-signal-demo"
  result_path: benchmarks/results/baseline.json
  publication_result_path: benchmarks/publication/stroke-signal-v2.json
  evidence_status: pending
release:
  docker: "docker run --rm --network none stroke-signal-demo"
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
