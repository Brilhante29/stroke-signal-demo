id: 4
name: stroke-signal-demo
program:
  id: mlops-data-platform
  narrative_fit: Reproduces a clinical stroke classifier with deterministic synthetic data, proving that ML reproducibility is achievable without real patient records.
  shared_assets:
    - reproducible benchmark JSON schema
    - synthetic medical fixture generator
status: implemented
claim: reproducao de classificador clinico
stack:
  - python
  - pandas
  - scikit-learn
  - matplotlib
  - docker
language_profile:
  primary: python-ml
  secondary: []
  reason: Python with scikit-learn is the standard for tabular ML classification benchmarks; pandas and numpy handle fixture generation efficiently.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: mlops-data-platform
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: recorded
  principles:
    coupling_rule: domain types depend only on standard library; model training depends only on scikit-learn and pandas; CLI depends on argparse.
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: one synthetic fixture, one classifier pipeline, one JSON benchmark output prove the claim without external data or infrastructure.
    testability_rule: domain and evaluation run with synthetic data; no network, database, or cloud dependency required.
    rejected_overengineering:
      - deep learning framework
      - real patient data dependency
      - GPU training
      - model serving API
  stack_profile: python-ml
  api_style: cli
  messaging: none
  cloud:
    mode: none
    local_provider: none
    real_provider_target: none
    emulated_services: []
    adapter_rule: no cloud dependency; all data is synthetic and local
    config_switch: none
    unsupported_behaviors: []
  database: none
  runtime: Python CLI in a slim Docker image; scikit-learn RandomForest with deterministic seed.
  library_policy: scikit-learn for classification and metrics; pandas for fixture generation; argparse for CLI; no other runtime dependencies.
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: PyTorch classifier
      reason: A linear or tree-based model is sufficient for tabular stroke prediction data; deep learning adds complexity without benchmark improvement.
    - option: Real medical dataset download
      reason: External datasets introduce reproducibility risk and network dependency; synthetic fixtures are deterministic and local.
architecture:
  style: pipeline
  reason: Data generation, model training, and evaluation form a natural three-stage pipeline from synthetic input to benchmark output.
  problem_forces:
    domain_complexity: low
    integration_pressure: low
    ui_state_complexity: none
    data_or_ml_reproducibility: high
    auditability: medium
    throughput_or_async: low
    independent_deployability: low
  dependency_rule: fixture depends only on numpy/pandas; model depends on scikit-learn and fixture types; CLI depends on both; benchmark orchestrates the pipeline.
  boundaries:
    - fixture owns synthetic data generation with deterministic seed
    - model owns training and evaluation pipeline
    - benchmark owns orchestration and JSON output
    - cli owns command-line interface
  rejected_alternatives:
    - style: hexagonal
      reason: There is no infrastructure or transport boundary to justify ports and adapters; a three-stage pipeline is sufficient.
    - style: microservices
      reason: A single-machine classification pipeline has no deployment boundary worth splitting.
benchmark:
  primary_metric: accuracy
  unit: unit
  command: "stroke-signal-demo benchmark --n-samples 5000 --seed 42 --output benchmarks/results/baseline.json"
  result_path: benchmarks/results/baseline.json
release:
  docker: "docker run --rm stroke-signal-demo"
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
